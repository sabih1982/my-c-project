version: '3.8'

services:
  dev:
    build: .
    user: utbot:utbot
    volumes:
      - .:/app
      - utbot_data:/home/utbot
    ports:
      - "8080:8080"  # Maps container port 8080 to host port 8080
    command: /bin/bash
    working_dir: /app
    environment:
      - USER=utbot
      - HOME=/home/utbot

  utbot-server:
    build: .
    user: utbot:utbot
    volumes:
      - .:/app
      - utbot_data:/home/utbot
    ports:
      - "8080:8080"  # Expose UTBot server
    working_dir: /opt/utbot_distr
    command: ./utbot_server_restart.sh
    restart: unless-stopped

volumes:
  utbot_data: