name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc clang

      - name: Build calculator
        run: |
          gcc -Wall -Wextra -Werror -std=c11 \
            -Isrc/headers \
            src/source/main.c src/source/calculator.c \
            -o calculator

      - name: Run calculator smoke test
        run: |
          output=$(./calculator)
          grep -Fq "5 + 3 = 8" <<< "$output"
          grep -Fq "10 - 4 = 6" <<< "$output"
          grep -Fq "5 * 4 = 20" <<< "$output"
          grep -Fq "10 / 2 = 5" <<< "$output"

      - name: Build and run fuzz target
        run: |
          mkdir -p ci-artifacts/fuzz-corpus
          clang -g -O1 \
            -fsanitize=fuzzer,address,undefined \
            -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            -Isrc/headers \
            src/source/fuzz_calculator.c src/source/calculator.c \
            -o ci-artifacts/fuzz_calculator
          timeout 10s ci-artifacts/fuzz_calculator \
            -max_total_time=5 \
            -detect_leaks=0 \
            ci-artifacts/fuzz-corpus

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: |
            calculator
            ci-artifacts/fuzz_calculator

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag my-c-app:${{ github.sha }} .

      - name: Run Docker smoke test
        run: |
          output=$(docker run --rm my-c-app:${{ github.sha }})
          grep -Fq "CI/CD Pipeline Working!" <<< "$output"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        run: |
          docker tag my-c-app:${{ github.sha }} "$DOCKER_USERNAME/my-c-app:latest"
          docker push "$DOCKER_USERNAME/my-c-app:latest"
