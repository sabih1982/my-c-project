name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc clang

      - name: Build calculator
        run: |
          gcc -Wall -Wextra -Werror -std=c11 \
            -Isrc/headers \
            src/source/main.c src/source/calculator.c \
            -o calculator

      - name: Run calculator smoke test
        run: |
          output=$(./calculator)
          grep -Fq "5 + 3 = 8" <<< "$output"
          grep -Fq "10 - 4 = 6" <<< "$output"
          grep -Fq "5 * 4 = 20" <<< "$output"
          grep -Fq "10 / 2 = 5" <<< "$output"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: calculator

  utbot-tests:
    runs-on: ubuntu-latest
    needs: build
    env:
      UTBOT: /utbot_distr/server-install/utbot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install UTBot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bear gcc g++ make wget unzip libgoogle-perftools4

      - name: Install UTBot
        run: |
          wget -q https://github.com/UnitTestBot/UTBotCpp/releases/download/2024.3.0/utbot-release-2024.3.0.zip -O /tmp/utbot.zip
          unzip -q /tmp/utbot.zip -d /tmp/utbot
          sudo tar -xf /tmp/utbot/utbot_distr.tar.gz -C /
          sudo chmod -R a+rx /utbot_distr

      - name: Generate UTBot tests and report
        run: bash ./ci_utbot_tests.sh

      - name: Upload UTBot reports
        uses: actions/upload-artifact@v4
        with:
          name: utbot-tests-report
          path: |
            ci-artifacts/utbot-tests
            ci-artifacts/utbot-build

  fuzz-coverage:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install fuzz and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc clang lcov

      - name: Generate fuzz and coverage reports
        run: bash ./ci_fuzz_coverage.sh

      - name: Upload fuzz and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage-reports
          path: ci-artifacts/fuzz-coverage

  docker:
    runs-on: ubuntu-latest
    needs: [build, utbot-tests, fuzz-coverage]
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag my-c-app:${{ github.sha }} .

      - name: Run Docker smoke test
        run: |
          output=$(docker run --rm my-c-app:${{ github.sha }})
          grep -Fq "CI/CD Pipeline Working!" <<< "$output"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        run: |
          docker tag my-c-app:${{ github.sha }} "$DOCKER_USERNAME/my-c-app:latest"
          docker push "$DOCKER_USERNAME/my-c-app:latest"
