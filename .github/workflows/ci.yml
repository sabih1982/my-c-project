name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make gcc
    
    - name: Build project
      run: |
        make clean
        make
    
    - name: Run tests
      run: |
        make test
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: calculator-executable
        path: calculator

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t my-c-app .
    
    - name: Test Docker container
      run: |
        docker run --rm my-c-app
    
    - name: Log in to Docker Hub (optional)
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push to Docker Hub (optional)
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag my-c-app ${{ secrets.DOCKER_USERNAME }}/my-c-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/my-c-app:latest